<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f4f5fb" />
    <title>Curve Courier · CSS easing workbench</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="fonts/type.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="comparison.css" />
    <script defer src="model.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <main>
      <header class="brand">
        <div class="orbit" aria-hidden="true"><i></i></div>
        <div>
          <h1>Curve <span>Courier</span></h1>
          <p>Tune a CSS easing curve and watch it travel.</p>
        </div>
      </header>

      <section class="graph-card" aria-labelledby="curve-title">
        <div class="cap">
          <h2 id="curve-title">Timing curve</h2>
          <span>Output / time</span>
        </div>
        <svg
          id="chart"
          viewBox="0 0 294 204"
          role="group"
          aria-label="Interactive timing curve"
          aria-describedby="graph-hint"
        >
          <defs>
            <pattern
              id="grid"
              x="28"
              y="26"
              width="30"
              height="19"
              patternUnits="userSpaceOnUse"
            >
              <path
                d="M30 0H0V19"
                fill="none"
                stroke="#ada7cb"
                stroke-width=".65"
              />
            </pattern>
          </defs>
          <rect x="28" y="26" width="240" height="152" fill="url(#grid)" />
          <g fill="none" stroke="#776a8d" stroke-width=".8">
            <path d="M28 140H268M28 64H268" stroke-dasharray="3 4" />
            <path d="M28 26v152h240" />
          </g>
          <g class="axes">
            <text x="19" y="144">0</text>
            <text x="19" y="67">1</text>
            <text x="28" y="194">0</text>
            <text x="268" y="194">1</text>
          </g>
          <g stroke="#884695" stroke-width="1.3">
            <line id="arm1" x1="28" y1="140" />
            <line id="arm2" x1="268" y1="64" />
          </g>
          <path
            id="curve"
            fill="none"
            stroke="#613597"
            stroke-width="2.6"
            stroke-linecap="round"
          />
          <path
            id="reference-curve"
            fill="none"
            stroke="#14645c"
            stroke-width="2"
            stroke-dasharray="4 4"
            hidden
          />
          <g fill="#884695" stroke="#f4f5fb" stroke-width="1.5">
            <circle id="dot1" r="4" />
            <circle id="dot2" r="4" />
          </g>
          <g fill="#38224b">
            <circle cx="28" cy="140" r="2.7" />
            <circle cx="268" cy="64" r="2.7" />
          </g>
          <g class="handle-tags" aria-hidden="true">
            <text id="tag1">1</text>
            <text id="tag2">2</text>
          </g>
          <g class="handles">
            <circle
              id="handle1"
              data-handle="1"
              r="5.5"
              tabindex="0"
              role="button"
              aria-label="Control point 1"
              aria-describedby="graph-hint"
            />
            <circle
              id="handle2"
              data-handle="2"
              r="5.5"
              tabindex="0"
              role="button"
              aria-label="Control point 2"
              aria-describedby="graph-hint"
            />
          </g>
        </svg>
        <p id="graph-hint">
          Drag either point, or use the arrow keys. Hold Shift for larger steps
          and Alt for fine adjustments.
        </p>
      </section>
      <section class="controls" aria-labelledby="control-title">
        <h2 id="control-title">Control points</h2>
        <label for="preset" class="preset-label">Curve preset</label>
        <select id="preset">
          <option value="express">Express out</option>
          <option value="linear">Linear</option>
          <option value="accelerate">Accelerate</option>
          <option value="decelerate">Decelerate</option>
          <option value="overshoot">Overshoot</option>
          <option value="custom" disabled>Custom</option>
        </select>
        <div class="sliders" id="sliders"></div>
        <div class="pin-actions">
          <button id="pin-reference" type="button">Pin current curve</button>
          <button id="clear-reference" type="button" hidden>
            Clear reference
          </button>
        </div>
        <p id="pin-status" role="status"></p>
      </section>
      <section class="preview" aria-labelledby="preview-title">
        <div class="cap">
          <h2 id="preview-title">Motion preview</h2>
          <span>900 ms</span>
        </div>
        <div class="preview-row">
          <div class="lanes">
            <div class="lane">
              <span class="lane-name">Current</span>
              <div class="track">
                <span id="runner" aria-hidden="true"></span>
              </div>
            </div>
            <div class="lane" id="reference-lane" hidden>
              <span class="lane-name">Pinned</span>
              <div class="track">
                <span id="reference-runner" aria-hidden="true"></span>
              </div>
            </div>
          </div>
          <button id="play" type="button">Play motion</button>
        </div>
        <p id="motion-status" role="status"></p>
      </section>
      <section class="code" aria-labelledby="code-title">
        <h2 id="code-title">CSS</h2>
        <div class="code-row">
          <code id="css"></code
          ><button id="copy" type="button">Copy CSS</button>
        </div>
        <p id="copy-status" role="status"></p>
        <form class="import-form" id="import-form">
          <label for="css-import">Import easing CSS</label>
          <textarea
            id="css-import"
            rows="2"
            maxlength="512"
            placeholder="cubic-bezier(0.25, 0.1, 0.25, 1)"
            aria-describedby="css-import-status"
          ></textarea>
          <button type="submit" id="apply-css">Apply curve</button>
          <p id="css-import-status" role="status"></p>
        </form>
      </section>
    </main>
  </body>
</html>
